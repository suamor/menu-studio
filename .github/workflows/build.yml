name: Build menu-studio

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    env:
      VCPKG_ROOT: ${{ github.workspace }}\extern\src\vcpkg
      VCPKG_TARGET_TRIPLET: x64-windows-static-md
      VCPKG_BUILTIN_BASELINE: fab1c6dc7a944372a90a1e19ab5e8e32cd658fc2

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fetch vcpkg baseline
        working-directory: ${{ env.VCPKG_ROOT }}
        shell: pwsh
        run: |
          git fetch origin ${{ env.VCPKG_BUILTIN_BASELINE }}
          git rev-parse --verify "$env:VCPKG_BUILTIN_BASELINE^{commit}"

      - name: Bootstrap vcpkg
        shell: cmd
        run: ${{ env.VCPKG_ROOT }}\bootstrap-vcpkg.bat

      - name: Configure
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DVCPKG_TARGET_TRIPLET=${{ env.VCPKG_TARGET_TRIPLET }}

      - name: Build
        run: >
          cmake
          --build build
          --config Release
          --parallel
          --verbose

      - name: Assemble install directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $dllName = 'MenuStudio.dll'

          $dlls = @(
            Get-ChildItem `
              -Path build `
              -Recurse `
              -File `
              -Filter $dllName
          )

          if ($dlls.Count -ne 1) {
            $dlls | ForEach-Object { Write-Host $_.FullName }
            throw "Expected exactly one $dllName under build/"
          }

          $dataDir = Join-Path $PWD 'package\data'

          New-Item -ItemType Directory -Force -Path package | Out-Null

          Copy-Item `
            -LiteralPath dist `
            -Destination $dataDir `
            -Recurse `
            -Force

          $pluginDir = Join-Path $PWD "package\data\SKSE\Plugins"

          New-Item -ItemType Directory -Force -Path $pluginDir | Out-Null

          Copy-Item `
            -LiteralPath $dlls[0].FullName `
            -Destination $pluginDir `
            -Force

      - name: Upload Menu Studio install
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: "Menu Studio"
          path: package/
          if-no-files-found: error
