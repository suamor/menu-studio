[General]
; Master switch for the whole mod.
bEnabled=1

; Menus stay vanilla until a mod that uses Menu Studio opens its own window
; over them. With this on, opening a container to move some iron ingots looks
; the same as it would without this mod installed: the world keeps running,
; the lights and the backdrop stay away, and the camera does not move. The
; studio comes up when the mod you installed this for says it is showing you
; something, and it goes back down when that window closes. Neither edge needs
; you to leave the menu.
;
; It does nothing until something has actually asked, once, in the current
; game session. A mod that has not been updated for this will never ask, so
; rather than give you a studio that silently never arrives, Menu Studio
; carries on as before.
;
; The strip of buttons keeps drawing while the studio is down, so the mod that
; lifts it is still one click away. Only buttons other mods put there are
; offered: Menu Studio's own all control a studio that is not running.
bWaitForOwnerContext=0

; Menu Studio needs its menus PAUSED. Skyrim Souls unpauses menus, which used
; to mean hand-editing SkyrimSoulsRE.ini (bContainerMenu=false and friends).
; Leave this ON and Menu Studio re-pauses ITS OWN menus (sMenus below)
; at open time through the engine's own pause bookkeeping. No Skyrim Souls
; INI edits needed, and every other menu keeps your Skyrim Souls behavior.
; Without Skyrim Souls this never does anything (menus already pause).
; Turn OFF only if you want the covered menus unpaused again. The studio
; then keeps just the lighting and the colour filter in them.
;
; LEFT UNSET ON PURPOSE: an explicit value here always wins, and Menu Studio
; detects Skyrim Souls by itself and fills in the right default (ON when Souls
; is present). Pinning =1 here defeated that detection for every install.
; Uncomment only to force a choice:
;bForcePause=1

; Tick the player's behavior graph each frame while a Menu Studio menu
; is open and the game is paused.
bTickAnimation=1

; FREEZE THE CHARACTER (off by default): hold the exact frame the menu
; caught. No animation, no settling to idle, no blinking: a still.
; Hair and cloth, body physics and your weapon preview all keep working,
; so the pose still reacts when you spin your character and still shows
; what you equip; only your character's own animation stops.
; Overrides bTickAnimation, bTickFace and bIdleInMenus while it is on.
bFreezeCharacter=0

; Menu Studio holds the caught frame when a pose cannot settle by itself.
; Untick this for a living pose more often, and the odd stutter or step in
; exchange. See docs/KNOWN-LIMITATIONS.md for why it exists.
; bFreezeUnsettledPose was removed in 0.7.5 and can be deleted from your INI.
; Caught part way through drawing or putting away a weapon:
bFreezeDrawSheathe=1

; Stop the weapon-preview animation pump the moment the draw or sheathe it
; is driving reaches an idle, instead of running a fixed budget past it.
; On by default: the field comparison selected it.
bPumpStopsAtIdle=1

; Let a menu opened mid-draw WHILE MOVING skip the draw/sheathe hold. Off: it
; lets a mid-transition graph keep ticking, which shows as walking in the menu.
bMovingArmStandsAside=0

; Drive FSMP (fingerprint-checked builds only) with the same dt so
; hair/cloth simulate while paused.
bDriveSmp=1

; Keep the player's FACE alive too: blink timers and MFG expression /
; phoneme / modifier ramps (Conditional Expressions etc. set targets; this
; keeps the ramps moving while paused).
bTickFace=1

; When another mod puts a companion in the shot (Fitting Room's outfit editor
; dressing a follower), keep her as alive as you are: same graph step, same
; face, same tick. Off, she stands there frozen next to a breathing character.
; Turn this off if she ever lunges or loops an animation. That is a known risk
; of stepping anyone's animation while the world is paused, and the guards that
; catch it for you do not know about her.
bTickCompanion=1

; Your FACE while the menu is up (needs bTickFace=1). Expression mods
; (Conditional Expressions and friends) run on Papyrus, which any paused
; menu freezes. Without help, opening mid-blink or mid-expression would
; hold that face the whole time.
; 1 = KEEP EXPRESSION (default): your expression mod's mood stays on the
;     face while the menu is up. Anything the pause caught mid-motion is
;     gently finished instead of sticking: a half-blink releases, a mouth
;     frozen mid-shape settles closed, off-center eyes come back to level,
;     and natural blinking continues. Your mods take over again the moment
;     the menu closes.
; 2 = NEUTRAL: the caught expression is saved, the face gently dissolves
;     to neutral for a standardized studio look, and your expression comes
;     back as it was when the menu closes (eyes open, since a half-finished
;     blink is never restored).
; 0 = OFF: no expression handling. With bTickFace=1 the face still
;     animates (ramps finish, natural blinking continues), but a blink the
;     pause caught halfway is never released; bTickFace=0 freezes the face
;     exactly as caught.
; (bNeutralExpression from older versions migrates to the new default;
; set iFaceInMenus=2 if you want the old dissolve-to-neutral look back.)
iFaceInMenus=1

; CBPC body physics while the studio is up (breast/butt/belly bounce).
; Uses CBPC's own paused-RaceMenu simulation path; recognized CBPC build only.
bDriveCbpc=1

; Keep equipped-spell hand art alive: switching spells in the Magic menu
; shows the new spell in your hands right away (when your hands are drawn;
; sheathed hands show nothing, exactly like unpaused play).
bTickMagicCasters=1

; Settle to idle: opening a menu mid-walk normally leaves the walk cycle
; looping in place (the movement controller is paused, so the graph keeps
; playing its last state). On menu open your character gets the same
; "input stopped" signal releasing the keys produces (grounded movement
; only; jumps and swimming are never touched) and blends to a natural
; idle; real movement resumes the moment the menu closes.
bIdleInMenus=1
; Graph flags that freeze the pose at menu open, the way attacks freeze.
; Dodge mods (TK Dodge, TUDM, DMCO...) read as ordinary walking otherwise
; and their animation would play out inside the menu. If your dodge mod
; uses a different variable name, add it here (comma-separated, no
; rebuild needed).
sFreezeGraphBools=bIsDodging, DMCO_IsDodging, bDMCO_IsDodging

; Show your weapon in hand (default ON): with a weapon equipped, your
; character draws it while a menu is open, so you can actually see how it
; looks in their hands, and puts it away again when you close the menu.
; They stand the way that weapon is held, so a greatsword and a bow read
; differently. The game picks the stance, exactly as it does in play.
; Swapping weapons inside the menu swaps what they are holding. This
; follows the right hand, so a weapon carried only in the left will not
; show (dual-wielding is fine, since drawing brings out both hands). If your
; weapon was already drawn, it simply stays drawn and nothing is put away
; on close. Skipped in combat and on horseback.
bWeaponPreviewInMenus=1

; Switch your head tracking off while a Menu Studio menu is open. Without
; this, head tracking (True Directional Movement's, for instance) keeps
; aiming your face somewhere while you rotate the preview, so the head
; sits twisted off the body. Normal head tracking comes back on close.
bFreezeHeadTracking=1
; The strip's editor button opens the engine's LIMITED sculptor mode:
; appearance only, no race or sex, the mode Galathil the face sculptor
; uses. Set false to open the full editor, race tab included.
; AE only either way. On SE the flag is not proven and the editor
; always opens full.
bLimitedEditor = true


; PREVIEW SPIN (default ON): spin the CHARACTER with right-mouse drag
; or the right stick while a Menu Studio menu is open. Camera-rotation
; mods (Show Player In Inventory's SmoothCam mode etc.) orbit the CAMERA.
; Nothing on the character moves, so hair/cloth physics correctly stays
; still. This spins the BODY: the skeleton really rotates, so hair
; swings with real momentum. Works while any animation plays; your
; character stands exactly as they did when the menu closes. Coexists
; with camera rotation (different input).
bPreviewSpin=1
; Show Player In Menus users only: SPIM rotates on right-mouse held as well,
; which is the same drag this spin uses, so one drag used to drive both at
; once and the character span at roughly double speed. With this ON, SPIM's
; rotation is neutralised while a Menu Studio menu is open and the spin above
; is the only thing that turns your character (SPIM keeps framing the shot;
; only its rotation steps aside, and it comes straight back when the menu
; closes or if you set bPreviewSpin=0). Set 0 to let both run like before.
; Does nothing without Show Player In Menus installed.
bOverrideSpimRotation=1
; Radians per mouse count while right-dragging (0.0005 - 0.05).
fSpinSensitivity=0.005
; Controller: move the RIGHT STICK to rotate directly, with no hold button
; (while an item's 3D preview is zoomed, the stick rotates the ITEM
; instead, exactly like Show Player In Menus handles it).
; iSpinGamepadButton is retired (parsed, unused).
iSpinGamepadButton=274
; Radians per second at full stick deflection (0.5 - 10).
fSpinStickSensitivity=3.0

; First-person menus: without this, opening barter (or any covered menu)
; from first person can leave you staring at nothing, since some player-view
; mods miss that path. Menu Studio switches to a third-person preview
; facing your character and puts first person back when the menu closes.
; Does nothing when the camera is already third person.
bOwnViewFirstPerson=1
; Own the framing on THIRD-person arms too when no installed view mod
; covers that menu (e.g. barter/container with only Show Player In
; Inventory present). That is the full SPIM-style over-shoulder framing:
; character beside the UI panels, fixed camera distance, 90 FOV,
; everything restored on close. With no view mod installed at all, the
; studio frames every menu itself.
bOwnViewUnmanaged=1
; Framing offsets (SPIM's PositionSettings semantics; defaults = the
; Nolvus preset). If Show Player In Menus' own MCM files exist, those
; win automatically so the two never drift apart.
;   X: sideways shift (over-shoulder X = -X - 75)
;   Y: camera distance (boom = 155 - Y)   Z: height (offset = Z - 50)
;   Pitch: player pitch = 0.2 + value     Rotation: yaw trim
fOwnViewXOffset=-20
fOwnViewYOffset=50
fOwnViewZOffset=0
fOwnViewPitch=0
fOwnViewRotation=0
; Mounted framing: a rider sits high on the horse, so these are added ON TOP
; of the offsets above only while you're on a mount, to frame the rider like
; the standing view instead of a tiny figure above a big horse.
;   Raise: look-at height (rider torso). Boom: extra camera distance; LOWER
;   = bigger rider (0 = same distance as standing). Pitch: extra downward tilt.
fOwnViewMountRaise=45
fOwnViewMountBoom=50
fOwnViewMountPitch=0

; Fade out: the stage and the rig lights dissolve when the menu closes
; (timing in seconds; 0 = instant). The opening fade-in and the black dip
; are disabled in this build and the keys below are ignored while they are
; reworked, so the studio appears instantly.
bSleekTransitions=1
fTransitionIn=0.0
fTransitionOut=0.15

; TEMPORARILY DISABLED (this build ignores these keys): the black fade
; in/out ran on the engine's fader menu, which is suspected of swallowing
; menu input (the Magic menu went unresponsive). On hold until the fade
; is reworked.
bDipToBlack=0
fDipOutSeconds=0.0
fDipInSeconds=0.35

; EXIT: an instant cut. A hold of 0 (default) takes the studio down at the
; menu close, so no part of the void reaches a post-menu frame. The cost:
; switching menus (inventory to magic) flashes the world for a few frames.
; Raise the hold to about 0.085 and switches stop flashing, at the price of
; the studio staying up that long after a real exit.
bSleekExit=1
fExitHoldSeconds=0
; Retired: the fade-to-black exit was removed because its black never
; reliably covered under ENB. Still parsed, used by nothing.
fExitDipSeconds=0.12
fExitInSeconds=0.20

; While the studio is up, eat RIGHT-mouse clicks in these menus so
; right-drag rotation never triggers the UI's quick buy/sell/equip
; (Vel'dun UI / Kome's Inventory Tweaks bind right-click; vanilla doesn't).
bBlockRightMouse=1

; A small strip of buttons drawn over the menu, so a mod can be reached from
; inside the menu you are already looking at. Menu Studio's own settings are
; always the first button; anything else is put there by the mods you have
; installed, and the strip does not appear at all when nothing has claimed a
; place on it. Needs FLICK (FUCK.dll).
bActionBar=1

; Where the strip sits, as a fraction of the screen rather than a pixel pair,
; so changing resolution moves it with the screen instead of stranding it off
; the edge. 0 is the left/top edge, 1 the right/bottom.
fActionBarX=0.965
fActionBarY=0.03

; The corner shape the strip's buttons are drawn with.
; 1 is the carved corner, 2 is the plain one. There is no third option.
;
; Stated here rather than left out: an absent key takes whichever default the
; DLL happens to carry, and this one has changed more than once.
iFrameStyle=1

; Which migrations this file has already been through. Do not edit: the mod
; writes it, and clearing it asks for the one-time fixes to run again.
iSettingsVersion=1

; Buttons taken OFF the strip, by id, comma separated. Empty means every
; button shows, which includes any a newly installed mod adds. A button is
; only ever hidden by being named here, so nothing new arrives switched off.
; Menu Studio's own are MenuStudio.RaceMenu and MenuStudio.Settings; other
; mods name their own (Fitting Room registers FittingRoom.Open). Easier to
; set from the Buttons tab in the settings panel than by hand.
sHiddenActions=

; Move the camera while a menu is open. Drag with the left mouse to swing it
; around your character and roll the wheel to move in and out. Turning your
; character is a separate thing on the right mouse (bPreviewSpin) and is not
; affected by any of this.
;
; Nothing is touched until you actually drag or scroll: the camera the menu
; opened with is kept exactly as it was until then.
bStudioCamera=1

; The bone the camera circles. The head keeps a face centred all the way in,
; which is what zooming is usually for; "NPC Spine2 [Spn2]" is the chest if
; you would rather keep the whole body centred instead.
sCameraPivotNode=NPC Head [Head]

fCameraOrbitSensitivity=0.006

; How far one notch of the wheel travels along the whole zoom range. The
; default crosses the range in about fifteen notches, and a notch feels the
; same close up and far out.
fCameraTrackStep=0.0667

; How the shot is composed. It aims at whatever you zoomed toward and
; hands the frame back to your whole character only as fast as zooming out
; forces it to, so boots stay boots until the picture is too big to hold
; them and then it becomes a full-length shot.
;
; Slack is how far the frame may hang past your character while it still
; has room to, which is what keeps a boot clear of the bottom edge instead
; of sitting on it. Raise it for more floor and sky, lower it to keep the
; frame filled with body.
fCameraTrackSlack=0.5

; How much wider a zoom onto a hand or a boot arrives than the menu asked
; for, counted in wheel notches. A skeleton knows where an ankle is but not
; how much heel hangs below it, so these come in a notch short of the ask
; and you see the whole shoe. Set 0 to take menus at their word.
fCameraFocusMargin=1.0

; The lens, as the tangent of half the vertical view angle. Menus run a
; 60 degree view here, which is this number. Change it only if yours does
; not, and only if wide shots frame too much or too little.
fCameraTrackLensSlope=0.325

; Where the middle of the body sits, from feet to crown.
fCameraTrackBodyMid=0.5

; How far the close shot follows a part that hangs off to the side, like a
; hand or a foot. Your character's own axis is what the camera circles, so
; without this a hand close-up frames the hip beside it. Fades out as you
; zoom out, since a wide shot wants the whole character centred. Set 0 to
; keep the camera on the axis always.
fCameraTrackLateral=1.0

; Where the closest framing aims, as a share of the way up from feet to
; crown. 0.93 is the eye line.
fCameraTrackFaceHeight=0.93

; Hold the middle mouse and drag to slide the framing. The pan has soft
; edges: push past them and the shot eases back, so your character never
; drifts out of reach. Speed counts per unit of distance, so the picture
; tracks your hand the same close up and far out; range is how far the
; frame may sit off your character sideways or upward, as a share of their
; height.
fCameraPanSensitivity=0.00045
fCameraPanRange=0.5

; How far the framing may go DOWN. Bigger than the range above on purpose:
; a close shot sits at eye level, so the shoes are most of a body height
; below it while the top of the head is right there. Raise it if you still
; cannot reach the feet.
fCameraPanRangeDown=1.0

; How much the camera trails your hand. 0 follows it almost exactly, 1 drifts
; along after it. Applies to turning and zooming alike, so the shot arrives
; all at once rather than sliding into place after it has finished turning.
fCameraSmoothing=0.7

; How near the camera may come, in game units, measured from the bone above.
; Raise it if the view ends up inside your character; lower it for a tighter
; close-up.
fCameraMinDistance=60

; Where the camera starts when the menu opened its shot on somebody else,
; which is what a follower editor does while Show Player In Inventory owns
; the menu: it frames YOU, and the camera here circles whoever the editor is
; dressing. Menus already framed on that character keep their own distance
; and never consult this.
fCameraOpenDistance=180

; How far out you may go. 250 frames a whole character with room around them
; and stops well before they turn into a speck.
;
; Set 0 to work it out from the space you are standing in instead: in the Void
; and the Dressing room that is the dome around you, which is the edge of
; anything there is to look at, and it then follows the dome if you resize it.
;
; The wheel travels a little past the limit and is then eased back, so you
; feel where the edge is rather than the picture just refusing to change.
fCameraMaxDistance=250

; Where on screen dragging moves the camera, as fractions of the display.
; Everywhere else keeps working exactly as it does now, so clicking your
; inventory is never taken for a camera drag.
;
; The default covers the right side, where SkyUI and the skins built on it
; stand your character. IF YOUR UI PUTS ITS ITEM LIST ON THE RIGHT, move
; these; that is a setting to change rather than something being broken.
; There is no way to work it out automatically: the menu itself reports
; "something clickable here" over the character just as often as over the
; list, which was measured rather than assumed.
fCameraZoneLeft=0.44
fCameraZoneTop=0.0
fCameraZoneRight=1.0
fCameraZoneBottom=1.0

; The same region again, for Grid Inventory. Its window is not where SkyUI's
; list is, so 0.44 above is the wrong edge there and a drag that started on
; the grid was swinging the camera. This one is a STARTING POINT rather than a
; measurement: Grid Inventory's window moves and scales with your own layout,
; so if the grid still takes your drags, raise fGridZoneLeft until it stops.
; The log names the spot the first drag was taken at, which is the number to
; move past.
fGridZoneLeft=0.66
fGridZoneTop=0.0
fGridZoneRight=1.0
fGridZoneBottom=1.0

; A middle CLICK over your character puts the camera back where the menu
; opened it. Turn this off if another mod wants that click; holding and
; dragging the middle button pans either way.
bMiddleClickRecentre=1

; Every menu opens on its own framing. Set 1 and the swing, zoom and slide you
; finish a menu with come back the next time one opens instead, so a full-body
; view stays a full-body view rather than being rebuilt every time you open a
; bag. What is stored is how far you moved from the shot the menu opened with,
; not a fixed camera position, so it still makes sense in a menu that frames you
; differently or when you are on a horse. Recentre the camera and close the menu
; to go back to opening on the default shot.
bRememberFraming=0

; Skyrim's floating item preview stays visible by default. A Vel'dun-style
; UI layout can move it and the item card off the right side
; where your character stands. Set 1 to hide the floating item preview while
; you browse, leaving your character alone on the 3D stage.
bDisableItemPreview3D=0

; Inspect mode has its own setting, separate from whether the floating item
; preview is visible. The wheel stays with the character until you press the
; inspect control. Without this, rolling the wheel over your character moves
; the camera and opens inspect mode behind it at the same time. Once inspect
; mode is open, the wheel works on the item as usual. Set 0 for the old
; behaviour.
bInspectNeedsHotkey=1

; Skip the third-person camera's obstruction pull-in while the studio is
; up. In the void (mode 2) the room is hidden anyway and free orbit is
; the point. In scene view (mode 1) the walls are VISIBLE, so the camera
; will glide through them. Set 0 there if that bothers you.
; Gameplay camera collision is untouched either way.
bBypassCameraCollision=1

; Hide the compass and crosshair while the studio is up over a menu that
; leaves them drawing. Skyrim's own menus put the game in menu mode and the
; HUD stands itself down, so this only ever reaches another mod's window,
; where the compass was sitting over the void. Set 0 to leave the HUD alone.
bHideHudOverCustomMenus=1

; Menus the studio covers (comma-separated menu names).
;
; THE CHARACTER EDITOR IS OFF BY DEFAULT, and adding it is one word:
;     sMenus=ContainerMenu,BarterMenu,InventoryMenu,MagicMenu,RaceSex Menu
; (the space in 'RaceSex Menu' matters: it is the engine's own name for
; that menu and the only one a menu event ever carries).
;
; It genuinely works: the studio, the space and the lighting all arm in
; there and the camera is yours on the first drag. What is NOT solved is
; the way out. That menu owns a camera of its own, and leaving it can
; strand the view in the framing the menu was using until you move the
; camera and force a rebuild. Three attempts at that did not hold, so it
; ships off rather than costing you a good exit on every visit. Add it if
; you would rather have the studio and live with the exit.
sMenus=ContainerMenu,BarterMenu,InventoryMenu,MagicMenu,GridInventoryMenu

; Which of those menus get the SPACE around you (the void / dressing room from
; [Declutter] below). The rest still pause, still keep your character alive and
; posed with physics; they just open over the normal world. Handy if you want
; the backdrop for your OWN character menus but not while looting a follower or
; trading with a merchant:
;   sSpaceMenus=InventoryMenu,MagicMenu
; Default is all of them (what the mod has always done). Also editable per menu
; in the settings panel.
sSpaceMenus=ContainerMenu,BarterMenu,InventoryMenu,MagicMenu,GridInventoryMenu

; 'GridInventoryMenu' in both lists above is Grid Inventory. That mod opens its
; own menu INSTEAD of the vanilla inventory, so without the name the studio
; never arms there and the action bar never draws. A menu you have not installed
; never opens, so the entry costs nothing if you do not use it.

; Clamp for the per-frame delta (seconds). Protects against hitches feeding a
; giant step into the graph/physics.
fMaxDeltaTime=0.05

; Once-per-second telemetry lines while armed (debug-level, log file only).
; Kept ON in the field-test install; the release default is OFF.
bVerboseLog=1

; Writes a few lines to the log in the second after a covered menu closes,
; saying whether the camera came back to the state it was in before the menu.
; It is how a report of "my camera is stuck after the inventory" gets answered
; from the log instead of a conversation. Nothing is logged during play, and a
; close costs about twenty lines.
;
; Turn it off if you want a quieter log. You lose nothing except the ability to
; diagnose that one class of problem.
bCameraCloseProbe=1

[Declutter]
; The space around you while the studio is up. Everything restores the
; moment the menu closes, and switching applies LIVE mid-menu (panel).
; 0 = OFF: menus open over the world exactly as you left it
; 1 = SCENE VIEW: the room stays visible with its own lighting; NPCs and
;     furniture are cleared out (the chair you sit on stays)
; 2 = VOID: everything around you is hidden, leaving a coloured void with
;     studio lighting and the three-point rig, and NO stage
; 3 = DRESSING ROOM: the void, plus a floor and any set pieces from the
;     chosen stage (see [Backdrop]). Studio lighting and the rig, the same
;     as mode 2
; (light sources stay in 2+3 so your lighting doesn't change; the chair
; you sit on stays in every mode)
; A colour FILTER can be layered on ANY of these views. See [Filter].
iDeclutterMode=2
; Modes 1+2: how far around you to clear (units; 4096 ~ 58 m).
fSoloHideRadius=4096
; Mode 2: also hide light refs' art (fires, candle flames, smoke, sparks).
; Their ILLUMINATION normally survives (the light itself isn't the mesh);
; set 0 if your setup disagrees and the character goes dark.
bHideLightRefs=1
; When another mod hands Menu Studio a companion to frame (Fitting Room does
; this while you dress a follower), SHE is the subject, so your character
; steps out of the shot and the studio rig lights her alone. Your character
; comes straight back when the menu closes. Set 0 to keep both of you on
; screen, which usually means standing in front of the person you are
; dressing. Does nothing unless a mod actually names a companion.
bHidePlayerForCompanion=1
; Void + dressing room: cut the CELL'S OWN light sources (the illumination
; itself, not just the art) so the character is lit purely by the studio
; rig and the studio light. No more brazier/candle glow from a room you
; can't even see. Your equipped torch/candlelight keeps working. Restores
; on close. Set 0 to let the cell keep lighting the character.
bCutCellLights=1
; Void + dressing room, outdoors: park the SUN and the sky's ambient fill
; so your character is lit by the studio rig alone, the same way the cell's
; own lights are cut indoors. Without this an outdoor void is a world you
; cannot see with full daylight still falling on you. The daylight comes
; back when the menu closes. Set 0 to keep the sun on your character
; outdoors.
bCutSunLight=1
; Void + dressing room: hide the parts of the world the other switches
; cannot reach. Grass (through the engine's own ToggleGrass), the terrain
; under and around you, distant LOD land and water, and any rain or snow
; the pause caught mid-air. Also disarms image-space blur, from a magic
; projectile for instance, frozen over the studio. Everything restores on
; close, and the void then looks the same indoors, outdoors and in any
; weather.
bVoidEngine=1
; Studio lighting while armed (interiors only; the void and the dressing
; room, since Off and Scene view keep the cell's own look by default).
; Colors come from [Lighting] below. Original cell lighting restores on
; menu close.
bStandardizeLighting=1
; Standardize the lighting OUTSIDE the void too (view modes 0 Off and 1
; Scene view). Unlike the rig, this rewrites the ROOM: its ambient, its fog
; and its image space all take the studio look, so with the world still on
; screen you restyle the whole place rather than just your character. Try
; bRigWithoutSpace first if you only want your character lit. Exteriors
; have no interior lighting data to rewrite, so out there the rig is the
; only piece that applies. Off by default.
bStudioLightWithoutSpace=0

[Backdrop]
; The BACKGROUND and the STAGE are independent: mix and match. Both are
; borrowed from the game's own meshes at runtime: render-side clones
; only, no plugin, no placed references, nothing touches your save;
; everything vanishes when the menu closes. Both switch LIVE (panel).
;
; BACKGROUND: the dome around you in the Void AND the Dressing room. Each
; sits in front of the opaque void shell, which blocks the sky behind it, so
; you can pick any of the game's constellation domes (switch live in the SKSE
; panel; size/height sliders retune each). A dome your load order lacks just
; falls back to the plain void.
;   blank         = a flat void COLOUR (set it with "Custom void color" below,
;                   or it follows the time-of-day vibe); no dome. THE DEFAULT,
;                   written here as an empty value
;   constellation = the skills-menu star dome
;   vampire       = Dawnguard's vampire perk constellation (needs Dawnguard)
;   aurora        = the third vanilla perk dome
;   custom        = YOUR OWN picture wrapped on the void sphere. Ships an
;                   example nebula; replace textures\mtb\voidshell_g.dds with
;                   any 2:1 (equirectangular) image to use your own. It shows
;                   as-is (not tinted). Turn on "Lock background angle" to keep
;                   it framed the same way every time.
sBackground=
; STAGE: the floor (+ set pieces) under you in the Dressing room:
;   starlight = the round Nightingale ceremony dais
sStage=starlight
; BACKDROP PACKS: drop packs under Data\SKSE\Plugins\MenuStudio\Backdrops\ to add
; your own backgrounds and stages to the lists above. The mod ships an example
; (Backdrops\Example.ini); see the "Make your own backdrop" section of the readme.
; Per-key overrides ON TOP of the chosen background/stage. Uncomment to
; pin one (the panel writes these automatically when you hand-tune
; sizes/heights). Mesh paths are under Data\meshes\ (BSA or loose
; files); clear one to drop that piece; sizes rescale whatever loads
; (bound radius in units, ~64 = 1 m); heights are relative to your feet.
;sFloorMesh=clutter\nightingale\nightingaleplatform.nif
;sDomeMesh=interface\intperkskydome.nif
; The SHELL: an enclosing surface just outside the star dome, the
; void's skin. The star dome is see-through where dark (additive
; shader), so without the shell, ENB mist and stray FX behind it become
; the background (the "white void"). Default: the mod's OWN mesh
; (meshes\mtb\voidshell.nif), a texturally flat, unlit sphere, so the
; void is ONE solid color in every cell (the vanilla domes had seams,
; shifted color per location, and their star textures read as the
; constellation even with sBackground=blank; old values migrate
; automatically). Clear the value to disable the shell.
;sShellMesh=mtb\voidshell.nif
; The star layer over the constellation. The vanilla skills menu draws
; its stars with this separate mesh next to the nebula dome. Clear the
; value to turn the stars off.
;sStarsMesh=interface\intperkstars01.nif
;fFloorRadius=600
;fDomeRadius=800
;fFloorZ=-10
;fDomeZ=0
; Emissive glow strength on the backdrop (0 = scene light only, up to 4).
; The glow COLOR follows the vibe (preset / time & season) live.
fBrightness=1.0
; Hard luminance ceiling on the void's color (dome + shell): the vibe and
; time of day vary the void's HUE, never its brightness, so it stays dark in
; every look and every cell (0.02 pitch black .. 0.35 washed; 0.10 default).
fVoidBrightnessCap=0.10
; LOCK BACKGROUND ANGLE (for custom images): the background is normally fixed
; to the WORLD, so which part of it sits behind your character depends on
; which way you were facing when you opened the menu (nice and varied for the
; star domes). Turn this ON and the sphere instead turns to FACE THE CAMERA,
; so a hand-made picture assigned to the void shell always frames the same
; way, and it follows if you orbit the camera. Off = the world-fixed look.
bLockBackgroundAngle=0
; Spin the background in place (-180..180 degrees) to compose where a custom
; image's focal point sits behind the character. Only used when the lock is ON.
fBackgroundYaw=0

[Lighting]
; The studio look used in the dressing room (background, stage and rig).
; A preset is a complete VIBE: background (ambient/fog/void color) AND the
; three-point rig (key/fill/rim colors + intensities) change together:
;   studio = neutral daylight, balanced rig (tuned on a full stack)
;   bright = strong clean neutrals, hot rig (for murky/light-poor cells)
;   warm   = candlelit amber: amber key, dim warm fill (harder shadows)
;   cool   = moonlit blue: pale key, deep-blue fill, strong icy rim
;   dusk   = sunset: orange key, violet fill, hot warm rim
; In-game: SKSE Menu Framework panel (if installed) edits all of this live.
sPreset=studio
; MATCH TIME & SEASON (default ON): ignore sPreset and pick the whole look
; from the game clock: day=studio, dawn/sunset=dusk, evening=warm,
; night=cool, tinted by the calendar season (summer +bright, autumn
; +warm, winter +cool). The dressing room follows Skyrim's time; colors
; update live while a menu is open. NOTE: while this is ON, the mood
; preset and every rig control below are driven by the clock (the panel
; greys them out); manual preset + color controls apply only while OFF.
bMatchTimeAndSeason=1
; Per-channel overrides (R,G,B 0-255) applied ON TOP of the preset.
; Uncomment to customize; rFog is also the VOID color you float in.
;rAmbient=96,96,100
;rDirectional=160,155,150
;rFog=13,13,15
;rFill=80,80,84
; Pick the voidsphere's color directly (panel has a color picker). When
; enabled, this exact color paints the shell: no vibe hue, no brightness
; cap. Off = the void follows the vibe/preset flow as usual.
bVoidColorOverride=0
rVoidColor=13,13,15
; Fog band (units). Pull fFogNear in for a tighter, moodier void.
fFogNear=3000
fFogFar=6000
; Studio rig: classic three-point lighting (warm KEY front-left, cool
; FILL front-right, white RIM behind) placed around you while the void is
; up. Real modeling light on the character even in cells that have no
; placed lights at all. Render-side only: no light forms, no placed
; references, nothing touches your save. All rig values apply LIVE:
; change them in the SKSE menu panel while the menu is open and watch.
bStudioRig=1
; Use the rig OUTSIDE the void too (view modes 0 Off and 1 Scene view), so
; the world stays exactly as it is behind you and only your character picks
; up the three studio lights. These are real point lights, so anything
; standing close by catches them as well; fRigBrightness dials that back.
; Off by default, so nothing changes on an existing install.
bRigWithoutSpace=0
; Scales all three rig lights at once (0.0 - 4; 0 = rig off). Default 0.2 is
; a soft rig; raise for punchier modelling light.
fRigBrightness=0.2
; Per-light control: enable / color (R,G,B) / intensity (0 - 4).
; Colors and intensities FOLLOW THE PRESET above (each preset is a full
; vibe: background + all three rig lights). Uncomment a key only to pin
; that channel across presets; the panel writes these automatically when
; you hand-tune a light.
bRigKey=1
;rRigKeyColor=255,242,222
;fRigKeyIntensity=1.0
bRigFill=1
;rRigFillColor=184,199,230
;fRigFillIntensity=1.0
bRigRim=1
;rRigRimColor=255,255,255
;fRigRimIntensity=1.0

[Filter]
; An optional colour grade over the WHOLE menu scene, in ANY view: a photo-style
; colour filter. OFF by default. It is a uniform screen wash, so it tints
; everything in frame, your CHARACTER included (a true world-not-character filter
; needs a stencil/compositor pass the plugin can't do; a nice-to-have deferred
; for later). All keys apply LIVE from the panel.
bColorFilter=0
; Filter colour (R,G,B 0-255). Default a warm sepia parchment.
rTintColor=200,170,120
; Strength: how strongly the colour washes the scene (0-1; lower = greyer).
fTintStrength=0.5
; Saturation (0-1; lower = more faded/desaturated).
fSaturation=0.6
; Brightness of the filtered scene (0-1.5; 1.0 = unchanged, below 1 dims).
fBrightness=0.9

[Compatibility]
; WHICH SKYRIM VERSIONS MENU STUDIO WILL LOAD ON. You should not need to touch
; this. Menu Studio runs on Skyrim SE 1.5.97 and on every Anniversary Edition
; from 1.6.317 up, and it checks its own engine addresses against YOUR build at
; startup. If that check fails it declines to load rather than load and
; misbehave. The result of the check is written to MenuStudio.log.
;
; 0 = normal. Load on 1.5.97 and 1.6.317+, and let the startup check decide.
; 1 = load anyway, even if the startup check fails. For testing only: the
;     pause features will most likely do nothing. If the author asked you to
;     set this, send them MenuStudio.log afterwards.
; 2 = strict. Only 1.5.97 and 1.6.1130+, the two builds Menu Studio was
;     originally verified against. Set this if a newer version misbehaves on
;     your build and you want the old refusal back.
iRuntimeGate=0
